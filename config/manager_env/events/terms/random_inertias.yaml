# wbt_lite_mlp-style inertia DR: ±10% scaling on waist_pitch_link inertia at startup.
random_inertias:
  _target_: isaaclab.managers.EventTermCfg
  func: gear_sonic.envs.manager_env.mdp:randomize_rigid_body_inertia
  mode: "startup"
  params:
    asset_cfg:
      _target_: isaaclab.managers.SceneEntityCfg
      name: "robot"
      body_names: "waist_pitch_link"
    scale: [0.9, 1.1]
